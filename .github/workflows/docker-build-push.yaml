---
name: Build and Push Containers on main push

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build-push-proxyd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push proxyd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./proxyd/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/espressosystems/op-celo-espresso-infra/proxyd:espresso-tag
