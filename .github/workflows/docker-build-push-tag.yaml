---
name: Build and Push proxyd on tag

on:
  push:
    tags:
      - proxyd-v[0-9].[0-9]+.[0-9]+
  workflow_dispatch:

jobs:
  build-push-proxyd-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute version tag
        id: tag
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^proxyd-//')" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push proxyd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./proxyd/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/espressosystems/op-celo-espresso-infra/proxyd:${{ steps.tag.outputs.version }}
            ghcr.io/espressosystems/op-celo-espresso-infra/proxyd:espresso-tag
